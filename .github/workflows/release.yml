name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: npm ci
      - run: npm run typecheck && npm test
      - run: npm run build
      - run: dotnet run --project native/Krono.Rules.Tests/Krono.Rules.Tests.csproj
      - run: dotnet run --project native/Krono.Sync.Tests/Krono.Sync.Tests.csproj
      - run: npm run test:native
      - run: npm run package:win
      - name: Build Windows installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
          ./scripts/build-installer.ps1 -Offline
      - name: Verify installed distribution
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'Krono install test'
          $desktop = Join-Path ([Environment]::GetFolderPath('DesktopDirectory')) 'Krono Agent.lnk'
          $startMenu = Join-Path ([Environment]::GetFolderPath('Programs')) 'Krono Agent/Krono Agent.lnk'
          $setup = Start-Process -FilePath (Resolve-Path release/Krono-Agent-Setup-x64.exe) -ArgumentList ('/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /TASKS=desktopicon /DIR="' + $target + '"') -WindowStyle Hidden -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw 'Installation failed.' }
          $env:KRONO_SMOKE_EXE = Join-Path $target 'KronoAgent.exe'
          $shortcut = (New-Object -ComObject WScript.Shell).CreateShortcut($desktop)
          if (!(Test-Path -LiteralPath $desktop) -or $shortcut.TargetPath -ne $env:KRONO_SMOKE_EXE) { throw 'Desktop shortcut has the wrong target.' }
          if (!(Test-Path -LiteralPath $startMenu) -or (New-Object -ComObject WScript.Shell).CreateShortcut($startMenu).TargetPath -ne $env:KRONO_SMOKE_EXE) { throw 'Start menu shortcut is missing or has the wrong target.' }
          $repair = Join-Path $target 'Krono-Repair.exe'
          $entry = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\KronoAgent_is1'
          if (!(Test-Path -LiteralPath $repair) -or !$entry.ModifyPath.StartsWith(('"' + $repair + '" '))) { throw 'Windows repair was not registered.' }
          $env:KRONO_USER_DATA = Join-Path $env:RUNNER_TEMP 'Krono repair profile'
          New-Item -ItemType Directory -Path $env:KRONO_USER_DATA -Force | Out-Null
          $sentinel = Join-Path $env:KRONO_USER_DATA 'keep-me.txt'
          Set-Content -LiteralPath $sentinel -Value 'repair preserves this profile'
          Remove-Item -LiteralPath $env:KRONO_SMOKE_EXE
          $repairArgs = $entry.ModifyPath.Substring($repair.Length + 3)
          $repaired = Start-Process -FilePath $repair -ArgumentList "$repairArgs /SUPPRESSMSGBOXES" -WindowStyle Hidden -Wait -PassThru
          if ($repaired.ExitCode -ne 0 -or !(Test-Path -LiteralPath $env:KRONO_SMOKE_EXE) -or
              (Get-Content -LiteralPath $sentinel) -ne 'repair preserves this profile') { throw 'Windows repair failed or changed the profile.' }
          node scripts/native-smoke.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Installed app failed native acceptance.' }
          $uninstall = Start-Process -FilePath (Join-Path $target 'unins000.exe') -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -WindowStyle Hidden -Wait -PassThru
          if ($uninstall.ExitCode -ne 0 -or (Test-Path -LiteralPath $desktop) -or (Test-Path -LiteralPath $env:KRONO_SMOKE_EXE)) { throw 'Uninstall failed.' }
      - uses: softprops/action-gh-release@v2
        with:
          files: release/Krono-Agent-Setup-x64.exe
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
