name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: npm ci
      - run: npm run typecheck && npm test
      - run: npm run build
      - run: npm run test:native
      - run: npm run package:win
      - name: Archive native Windows distribution
        shell: pwsh
        run: |
          Compress-Archive -LiteralPath release/Krono-Agent -DestinationPath release/Krono-Agent-Windows-x64.zip
          $kronoReleaseCheck = Join-Path $env:RUNNER_TEMP 'krono-release-check'
          Expand-Archive -LiteralPath release/Krono-Agent-Windows-x64.zip -DestinationPath $kronoReleaseCheck
          $env:KRONO_SMOKE_EXE = Join-Path $kronoReleaseCheck 'Krono-Agent/KronoAgent.exe'
          node scripts/native-smoke.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Extracted release distribution failed native acceptance.' }
      - uses: actions/upload-artifact@v4
        with:
          name: Krono-Agent-Windows-x64
          path: release/Krono-Agent-Windows-x64.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: release/Krono-Agent-Windows-x64.zip
          prerelease: ${{ contains(github.ref_name, '-') }}
