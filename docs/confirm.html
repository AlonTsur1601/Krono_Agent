<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Email confirmation · Krono Agent</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #10151d; color: #f4f8f6; font: 16px/1.55 system-ui, sans-serif; }
  main { margin: 24px; width: min(400px, calc(100% - 112px)); padding: 32px; border: 1px solid #344452; border-radius: 22px; background: #1b2532; }
  img { display: block; } h1 { line-height: 1.15; } p { color: #d2dce5; margin-bottom: 0; }
</style>
<main>
  <img src="krono-mark.png" width="48" height="48" alt="Krono Agent">
  <h1 id="title">Email confirmation</h1>
  <p id="message">Open the link in your confirmation email to continue.</p>
</main>
<script>
  const result = location.hash;
  if (result === '#confirmed' || result === '#expired') {
    document.getElementById('title').textContent = result === '#confirmed' ? 'Email confirmed' : 'Confirmation link expired';
    document.getElementById('message').textContent = result === '#confirmed'
      ? 'You can close this tab and return to Krono Agent.'
      : 'Return to Krono Agent and request a new confirmation email.';
  }
</script>
</html>
