<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Upper form: rounded rectangle suggesting upper part of hourglass and left stroke of K -->
  <rect x="14" y="8" width="18" height="24" rx="4" fill="#8FD7C7"/>
  
  <!-- Lower form: rounded rectangle offset, suggesting lower part of hourglass and diagonal of K -->
  <rect x="32" y="32" width="18" height="24" rx="4" fill="#8FD7C7"/>
  
  <!-- Pixel accent: small square suggesting digital/tech aesthetic -->
  <rect x="28" y="28" width="4" height="4" fill="#8FD7C7"/>
  
  <!-- The negative space between the two offset forms creates:
       1. An hourglass silhouette through the narrow middle
       2. The letter K through the angular relationship -->
</svg>
