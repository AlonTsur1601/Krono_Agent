npmRebuild: false
appId: com.krono.agent
productName: Krono Agent
copyright: Copyright © 2026 Alon Tsur

directories:
  output: release
  buildResources: assets

files:
  - dist/**/*
  - package.json

extraResources:
  - assets/logo/**/*
  - assets/games/**/*
  - assets/sounds/**/*

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
  icon: assets/logo/icons/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Krono Agent

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: assets/logo/icons/icon.icns
  category: public.app-category.productivity

linux:
  target:
    - target: AppImage
      arch:
        - x64
  icon: assets/logo/icons/
  category: Utility

publish:
  provider: github
  owner: AlonTsur1601
  repo: Krono_Agent
